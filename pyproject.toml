[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "1.0.0"
description = "JARVIS v1.0.0: Stateful Personal AI Operating System engineered with Zero-Trust principles"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "JARVIS Team", email = "engineering@jarvis.ai" }
]
license = { text = "Proprietary" }
dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.1",
    "langchain-groq>=0.2.0",
    "groq>=0.11.0",
    "openai>=1.40.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.3.0",
    "psutil>=6.0.0",
    "pywinauto>=0.6.8",
    "pygetwindow>=0.0.9",
    "pyautogui>=0.9.54",
    "pycaw>=20240210",
    "comtypes>=1.4.0",
    "edge-tts>=6.1.12",
    "sounddevice>=0.4.7",
    "numpy>=1.26.0",
    "qdrant-client>=1.10.0",
    "chromadb>=0.5.0",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "colorama>=0.4.6",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function call in argument defaults (fastapi Depends)
    "RUF012", # Mutable class attributes in Pydantic models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pywinauto.*",
    "pygetwindow.*",
    "pyautogui.*",
    "pycaw.*",
    "comtypes.*",
    "sounddevice.*",
    "chromadb.*",
    "qdrant_client.*",
    "edge_tts.*",
    "google_genai.*",
    "langchain_google_genai.*",
    "langchain_groq.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "jarvis"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security invariant tests",
    "contract: Interface and schema contract tests",
    "evals: Quality and trajectory evals",
    "chaos: Chaos and failure injection tests",
]

[tool.coverage.run]
source = ["jarvis"]
omit = [
    "tests/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
