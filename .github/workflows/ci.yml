name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python and frontend checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: substrate/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --all-extras

      - name: Install locked Node dependencies
        run: npm --prefix substrate ci --ignore-scripts

      - name: Ruff lint
        run: uv run --locked ruff check src tests

      - name: Ruff format
        run: uv run --locked ruff format --check src tests

      - name: Offline headless regression suite
        run: uv run --locked pytest -m "not audio and not browser"

      - name: Frontend syntax check
        shell: bash
        run: |
          for file in \
            frontend/js/app.js \
            frontend/js/config.js \
            frontend/js/audio/player.js \
            frontend/js/audio/recorder.js \
            frontend/js/components/particle-field.js \
            frontend/js/components/signal-orb.js \
            frontend/js/components/speaking-orb.js \
            frontend/js/gateway/client.js; do
            node --check "$file"
          done
