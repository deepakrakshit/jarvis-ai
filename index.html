<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS · Autonomous Neural Interface</title>
<meta name="description" content="JARVIS Personal AI Operating System - Autonomous Multimodal Interface">

<!-- Modular Frontend Stylesheets -->
<link rel="stylesheet" href="frontend/css/main.css">
<link rel="stylesheet" href="frontend/css/orbs.css">

<!-- Modular Frontend Application Orchestration -->
<script type="module" src="frontend/js/app.js"></script>
</head>
<body>
<div class="grain"></div>

<!-- Top Bar Status -->
<header class="top-status">
  <div class="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span id="gateway-label">JARVIS OPERATIONAL</span>
  </div>
  <div class="mode-badge" id="mode-badge">Listening</div>
</header>

<!-- Central Viewport -->
<main class="viewport-area">
  <div class="orb-viewport">
    <signal-orb id="signal-orb" state="listening" level="0.4" class="orb-visible"></signal-orb>
    <speaking-orb id="speaking-orb" state="listening" level="0.4" class="orb-hidden"></speaking-orb>
  </div>
  <div class="feedback-line" id="feedback-line">Standing by for voice or command.</div>
</main>

<!-- Bottom Input Capsule -->
<footer class="input-capsule-container">
  <form class="input-capsule" id="prompt-form">
    <button type="button" class="btn-mic" id="btn-mic" title="Voice Input" aria-label="Microphone">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <input 
      type="text" 
      class="prompt-input" 
      id="prompt-input" 
      placeholder="Ask JARVIS anything, or press Mic to speak..." 
      aria-label="Prompt Input"
      autocomplete="off"
    >
    <button type="submit" class="btn-send" id="btn-send" title="Transmit" aria-label="Transmit">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </form>
</footer>
</body>
</html>
